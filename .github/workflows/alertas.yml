name: Escáner de alertas

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # cada 15 minutos, en minutos "raros" (a las :00 y :30 GitHub se satura y atrasa)
  workflow_dispatch:          # permite correrlo a mano desde GitHub

permissions:
  contents: write             # para guardar el estado (qué alertas ya se mandaron)

concurrency:
  group: escaner              # nunca dos corridas a la vez (para no pisar el estado)
  cancel-in-progress: false

jobs:
  escanear:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-alertas.txt
      - run: pip install -r requirements-alertas.txt
      - name: Correr escáner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.alertas.escaner
      - name: Guardar estado
        run: |
          git config user.name "escaner-alertas"
          git config user.email "escaner-alertas@users.noreply.github.com"
          git add data/alertas/estado.json data/alertas/universo.json
          git diff --cached --quiet || git commit -m "Estado de alertas $(date -u +'%F %H:%M')"
          git pull --rebase
          git push
