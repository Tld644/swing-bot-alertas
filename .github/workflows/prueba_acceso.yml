name: Prueba de acceso a exchanges (temporal)
on:
  workflow_dispatch:
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Probar conexiones
        run: |
          probar() { printf "%-28s HTTP %s\n" "$1" "$(curl -s -m 20 -o /tmp/r -w '%{http_code}' "$2")"; head -c 120 /tmp/r; echo; }
          probar "Binance spot (data-api)" "https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=1"
          probar "Binance api principal"   "https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=1"
          probar "Binance FUTUROS (fapi)"  "https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=1d&limit=1"
          probar "OKX perpetuos"           "https://www.okx.com/api/v5/market/candles?instId=BTC-USDT-SWAP&bar=1D&limit=1"
          probar "Bybit perpetuos"         "https://api.bybit.com/v5/market/kline?category=linear&symbol=BTCUSDT&interval=D&limit=1"
          probar "Bitget perpetuos"        "https://api.bitget.com/api/v2/mix/market/candles?symbol=BTCUSDT&productType=USDT-FUTURES&granularity=1D&limit=1"
          probar "BingX perpetuos"         "https://open-api.bingx.com/openApi/swap/v3/quote/klines?symbol=BTC-USDT&interval=1d&limit=1"
          printf "%-28s HTTP %s\n" "Hyperliquid" "$(curl -s -m 20 -o /tmp/r -w '%{http_code}' -X POST https://api.hyperliquid.xyz/info -H 'Content-Type: application/json' -d '{"type":"meta"}')"; head -c 80 /tmp/r; echo
